[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
    --deselect tests/test_skills.py::test_no_executable_scripts
filterwarnings =
    ignore::DeprecationWarning
# deselect 原因：test_no_executable_scripts 是纯提示词时代（V5 之前）的 legacy 断言，
# 禁止仓内出现任何 .py；但 P1 深度改造规范要求 T1/T3 资产必须携带确定性脚本
# （skills/rfm-segmentation/scripts/rfm_segmentation.py 与 5 个 workflows/*/scripts/run_flow.py），
# 两者冲突。按 REFIT_SPEC 指示以 deselect 方式跳过该断言，不改 tests/ 文件本身。
